[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project]
name = "shell-session-manager"
version = "1.0.0"
description = "Async subprocess session manager with incremental stdin/stdout/stderr support"
authors = [
    {name = "Yanli 盐粒", email = "yanli@mail.one"},
]
dependencies = ["anyio>=4.12.1"]
requires-python = "==3.14.*"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.0",
    "basedpyright>=1.34.0",
]



[tool.ruff]
# Ruff doesn't yet recognize `py314`; keep this at the newest supported target.
target-version = "py312"
extend-exclude = [".venv", ".pdm-build"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "PIE", "RUF"]
ignore = ["N818", "E501", "SIM108", "SIM103", "B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.basedpyright]
exclude = ["tests", ".venv", ".pdm-build"]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pdm]
distribution = true

[tool.pdm.scripts]
lint = "ruff check . --fix"
format = "ruff format ."
fix = {composite = ["format", "lint"]}
typecheck = "basedpyright ."
test = { cmd = "pytest", env = { PYTHONPATH = "src" } }
