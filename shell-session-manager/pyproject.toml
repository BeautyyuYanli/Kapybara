[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project]
name = "shell-session-manager"
version = "2.2.1"
description = "Async subprocess session manager with incremental stdin/stdout/stderr support"
authors = [
    {name = "Yanli 盐粒", email = "yanli@mail.one"},
]
dependencies = [
    "aiosqlite>=0.21.0",
    "anyio>=4.12.1",
    "fastapi>=0.116.1",
    "httpx>=0.28.1",
    "pydantic>=2.12.5",
    "sqlmodel>=0.0.24",
    "typer>=0.16.1",
    "uvicorn>=0.35.0",
]
requires-python = ">=3.12"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]

[project.scripts]
shellctl = "shell_session_manager.shellctl.server:main"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.0",
    "basedpyright>=1.34.0",
]



[tool.ruff]
# Ruff doesn't yet recognize `py314`; keep this at the newest supported target.
target-version = "py312"
extend-exclude = [".venv", ".pdm-build"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "PIE", "RUF"]
ignore = ["N818", "E501", "SIM108", "SIM103", "B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.basedpyright]
exclude = ["tests", ".venv", ".pdm-build"]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pdm]
distribution = true

[tool.pdm.scripts]
lint = "ruff check . --fix"
format = "ruff format ."
fix = {composite = ["format", "lint"]}
typecheck = "basedpyright ."
test = { cmd = "pytest", env = { PYTHONPATH = "src" } }
