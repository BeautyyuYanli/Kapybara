services:
  basic-os:
    image: ${IMAGE_NAME:-kapybara-basic-os:latest}
    build:
      context: ..
      dockerfile: docker/basic-os/Dockerfile
    environment:
      PUID: "${PUID:?set PUID (e.g. id -u)}"
      PGID: "${PGID:?set PGID (e.g. id -g)}"
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ../data/fs:/home/k
      # Bind the Debian crontab spool so root cron jobs remain visible through
      # `crontab -l` and persist across container rebuilds.
      - ../data/crontabs:/var/spool/cron/crontabs
      - ../core:/core
      - ../collections:/collections
