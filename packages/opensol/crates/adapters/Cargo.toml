[package]
name = "opensol-adapters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Independent adapters for existing sandbox providers and process daemons"

[features]
default = ["local"]
local = ["dep:nix"]
ssh = ["local"]
docker = ["dep:bollard"]
pueue = []
e2b = ["envd"]
envd = ["dep:reqwest", "dep:prost", "dep:base64", "dep:prost-build", "dep:protoc-bin-vendored"]
sandboxd = ["grpc"]
agent-sandbox = ["local", "dep:uuid"]
openshell = ["grpc"]
grpc = ["dep:tonic", "dep:tonic-prost", "dep:prost", "dep:prost-types", "dep:tonic-prost-build", "dep:protoc-bin-vendored"]
protocol-server = []
all = ["local", "ssh", "docker", "pueue", "e2b", "envd", "sandboxd", "agent-sandbox", "openshell"]

[dependencies]
opensol-core.workspace = true
async-trait.workspace = true
async-stream.workspace = true
bytes.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
nix = { version = "0.30.1", features = ["signal", "process"], optional = true }
bollard = { version = "0.21.1", optional = true }
reqwest = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
prost-types = { version = "0.14.1", optional = true }
tonic = { workspace = true, optional = true }
tonic-prost = { version = "0.14.2", optional = true }
base64 = { version = "0.22.1", optional = true }
uuid = { version = "1.18", features = ["v4"], optional = true }

[build-dependencies]
prost-build = { version = "0.14.1", optional = true }
tonic-prost-build = { version = "0.14.2", optional = true }
protoc-bin-vendored = { version = "3.2.0", optional = true }

[dev-dependencies]
tokio-stream = { version = "0.1.17", features = ["net"] }
tempfile = "3.23"
axum = "0.8.6"

[lints]
workspace = true

[[example]]
name = "local_exec"
path = "../../examples/local_exec.rs"
required-features = ["local"]

[[example]]
name = "docker_pueue"
path = "../../examples/docker_pueue.rs"
required-features = ["docker", "pueue"]

[[example]]
name = "e2b_envd"
path = "../../examples/e2b_envd.rs"
required-features = ["e2b"]
