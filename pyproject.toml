[project]
name = "kapy"
version = "0.1.0"
description = "Agent session services with independent HTTP and Telegram interfaces"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.16",
    "anyio>=4.15.1",
    "fastapi>=0.141.1",
    "httpx2>=2.12.0",
    "kapy-mcp-gateway",
    "kapy-shellctl",
    "logfire>=5.0.0",
    "platformdirs>=4.11.7",
    "psycopg[binary,pool]>=3.3.5",
    "pydantic>=2.13.5",
    "pydantic-ai-harness[codemode]>=0.54.0,<0.55.0",
    "pydantic-ai-layer-protocol",
    "pydantic-ai-slim[google,mcp,openai]>=2.54.0",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "sqlglot>=30.18.0",
    "sqlmodel>=0.0.42",
    "temporalio>=1.33.0",
    "typer>=0.27.2",
    "uvicorn[standard]>=0.52.4",
    "uvloop>=0.22.1",
    "valkey>=6.1.1",
    "websockets>=16,<17",
]

[project.scripts]
kapy = "kapy.cli:main"

[build-system]
requires = ["uv_build>=0.11.13,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = [
    "prototype",
    "packages/shellctl/server",
    "packages/shellctl/src",
    "packages/shellctl/tests/upstream",
]

[tool.uv.workspace]
members = ["packages/shellctl", "packages/mcp_gateway", "packages/pydantic-ai-layer-protocol"]

[tool.uv.sources]
kapy-mcp-gateway = { workspace = true }
kapy-shellctl = { workspace = true }
pydantic-ai-layer-protocol = { workspace = true }

[tool.uv.build-backend]
source-exclude = ["prototype/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["kapy", "pydantic_ai_layer_protocol", "layer_protocol_tests"]

[tool.pyrefly]
project-includes = [
    "src", "tests", "scripts",
    "packages/pydantic-ai-layer-protocol/src", "packages/pydantic-ai-layer-protocol/tests",
]
search-path = [
    "src", "tests", "scripts",
    "packages/pydantic-ai-layer-protocol/src", "packages/pydantic-ai-layer-protocol/tests",
]
python-version = "3.14"

[tool.pytest.ini_options]
testpaths = ["tests", "packages/pydantic-ai-layer-protocol/tests"]
pythonpath = ["tests", "packages/pydantic-ai-layer-protocol/tests"]
python_files = ["test_*.py", "docker_manager_acceptance.py"]
markers = ["integration: requires local PostgreSQL and Valkey", "live: requires explicit live service credentials"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyrefly>=1.2.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.6",
]
