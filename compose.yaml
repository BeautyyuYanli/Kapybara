name: kapy-v2
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kapy
      POSTGRES_PASSWORD: kapy-local
      POSTGRES_DB: kapy
    ports:
      - "127.0.0.1:${KAPY_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kapy -d kapy"]
      interval: 2s
      timeout: 3s
      retries: 30
  temporal:
    image: temporalio/auto-setup:1.29.1
    environment:
      DB: postgres12
      POSTGRES_SEEDS: postgres
      DB_PORT: 5432
      POSTGRES_USER: kapy
      POSTGRES_PWD: kapy-local
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      ENABLE_ES: "false"
    ports:
      - "127.0.0.1:${KAPY_TEMPORAL_PORT:-7233}:7233"
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "temporal:7233"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      postgres:
        condition: service_healthy
  runner-worker:
    image: kapy-v2:tmpv2
    build: .
    init: true
    command: ["python", "-m", "kapy.runner_duarable.worker"]
    user: "10001:10001"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 30s
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      KAPY_DATABASE_URL: postgresql://kapy:kapy-local@postgres:5432/kapy
      KAPY_DATABASE_SCHEMA: ${KAPY_DATABASE_SCHEMA:-kapy_tmpv2}
      KAPY_VALKEY_URL: redis://valkey:6379/0
      KAPY_VALKEY_NAMESPACE: ${KAPY_VALKEY_NAMESPACE:-kapy_tmpv2}
      KAPY_TEMPORAL_ADDRESS: temporal:7233
      KAPY_TEMPORAL_NAMESPACE: ${KAPY_TEMPORAL_NAMESPACE:-default}
      KAPY_TEMPORAL_TASK_QUEUE: ${KAPY_TEMPORAL_TASK_QUEUE:-kapy-runner}
    volumes:
      - ./src:/app/src:ro
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      temporal:
        condition: service_healthy
    mem_limit: 2g
    pids_limit: 256
  valkey:
    image: valkey/valkey:8-alpine
    # Output uses Pub/Sub: there are no messages to persist or expire.
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${KAPY_VALKEY_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
  runtime:
    image: kapy-v2:tmpv2
    build: .
    init: true
    command: ["kapy", "interface", "http", "serve", "--host", "0.0.0.0", "--port", "8000", "--frontend-dist", "/app/frontend/dist"]
    ports:
      - "0.0.0.0:${KAPY_HTTP_PORT:-8000}:8000"
    user: "10001:10001"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      XDG_STATE_HOME: /var/lib/kapy/state
      KAPY_DATABASE_URL: postgresql://kapy:kapy-local@postgres:5432/kapy
      KAPY_DATABASE_SCHEMA: ${KAPY_DATABASE_SCHEMA:-kapy_tmpv2}
      KAPY_TEMPORAL_ADDRESS: temporal:7233
      KAPY_TEMPORAL_NAMESPACE: ${KAPY_TEMPORAL_NAMESPACE:-default}
      KAPY_TEMPORAL_TASK_QUEUE: ${KAPY_TEMPORAL_TASK_QUEUE:-kapy-runner}
      KAPY_VALKEY_URL: redis://valkey:6379/0
      KAPY_VALKEY_NAMESPACE: ${KAPY_VALKEY_NAMESPACE:-kapy_tmpv2}
      KAPY_OUTPUT_FLUSH_INTERVAL: ${KAPY_OUTPUT_FLUSH_INTERVAL:-0.5}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
    volumes:
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
      - ./scripts:/app/scripts:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
      - runtime-data:/var/lib/kapy
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      temporal:
        condition: service_healthy
    mem_limit: 2g
    pids_limit: 256
  telegram:
    image: kapy-v2:tmpv2
    build: .
    init: true
    command: ["kapy", "interface", "telegram", "serve"]
    user: "10001:10001"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      XDG_STATE_HOME: /var/lib/kapy/state
      KAPY_DATABASE_URL: postgresql://kapy:kapy-local@postgres:5432/kapy
      KAPY_DATABASE_SCHEMA: ${KAPY_DATABASE_SCHEMA:-kapy_tmpv2}
      KAPY_TEMPORAL_ADDRESS: temporal:7233
      KAPY_TEMPORAL_NAMESPACE: ${KAPY_TEMPORAL_NAMESPACE:-default}
      KAPY_TEMPORAL_TASK_QUEUE: ${KAPY_TEMPORAL_TASK_QUEUE:-kapy-runner}
      KAPY_VALKEY_URL: redis://valkey:6379/0
      KAPY_VALKEY_NAMESPACE: ${KAPY_VALKEY_NAMESPACE:-kapy_tmpv2}
      KAPY_OUTPUT_FLUSH_INTERVAL: ${KAPY_OUTPUT_FLUSH_INTERVAL:-0.5}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}
      KAPY_TELEGRAM_ALLOWED_CHAT_IDS: ${KAPY_TELEGRAM_ALLOWED_CHAT_IDS:-[${TELEGRAM_CHAT_ID:?TELEGRAM_CHAT_ID is required}]}
      KAPY_TELEGRAM_SESSION_TEMPLATE: ${KAPY_TELEGRAM_SESSION_TEMPLATE:-null}
    volumes:
      - ./src:/app/src:ro
      - telegram-data:/var/lib/kapy
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      temporal:
        condition: service_healthy
    mem_limit: 2g
    pids_limit: 256
volumes:
  postgres-data:
  runtime-data:
  telegram-data:
