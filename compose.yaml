name: kapy-v2
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kapy
      POSTGRES_PASSWORD: kapy-local
      POSTGRES_DB: kapy
    ports:
      - "127.0.0.1:${KAPY_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kapy -d kapy"]
      interval: 2s
      timeout: 3s
      retries: 30
  valkey:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${KAPY_VALKEY_PORT:-56379}:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres-data:
  valkey-data:
