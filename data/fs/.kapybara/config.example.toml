# Copy this file to `config.toml` and set the provider/model pair you want the
# installed `kapy` CLI to use by default. Google AI Studio with Gemini Flash is
# the recommended default.
[agent_run]
provider = "google"
model_name = "gemini-3-flash-preview"
google_api_key = ""
# google_base_url = "https://generativelanguage.googleapis.com"

# Uncomment these if you use a different provider.
# openai_api_key = ""
# openai_base_url = ""
# anthropic_api_key = ""
# anthropic_base_url = ""

# Uncomment to configure Logfire explicitly.
#[logfire]
#token = ""
